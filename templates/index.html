<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карточки классов</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        #card-list {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        .card {
            max-width: 25%;
            width: calc(33.333% - 40px);
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .card img {
            max-width: 100%;
            height: auto;
        }

        #add-card-form {
            margin-top: 20px;
        }

        #file-input-container {
            margin-bottom: 10px;
        }

        .file-input {
            margin-right: 10px;
        }

        .m-y {
            margin-bottom: 1rem;
        }
    </style>
</head>

<body>
    <h1>Генератор датасета для yolo</h1>
    <h1 id="per"></h1>

    <!-- Форма для добавления новой карточки -->
    <form id="add-card-form">
        <input class="m-y" type="text" id="class-name-input" placeholder="Введите название класса">
        <div id="file-input-container"></div>
        <button class="m-y" type="submit">Добавить класс</button>
    </form>
    <!-- Кнопка отправки на сервер -->
    <input class="m-y" type="number" id="num-gen-input" placeholder="Сгенерировать картинок на класс">
    <button class="m-y" id="send-to-server">Отправить на сервер</button>
    <!-- Список карточек -->
    <div id="card-list"></div>

    <script>
        const sendButton = document.getElementById('send-to-server');
        const progress = document.getElementById('per');
        let pendingReads = 0;
        let generating = false;

        function updateSendButton() {
            sendButton.disabled = generating || pendingReads > 0;
        }

        function renderFiles(container, files, input) {
            container.replaceChildren();
            input.disabled = true;
            let remaining = files.length;
            if (remaining === 0) {
                input.disabled = false;
                return;
            }
            for (const file of files) {
                pendingReads += 1;
                const reader = new FileReader();
                reader.addEventListener('load', () => {
                    const image = document.createElement('img');
                    image.src = reader.result;
                    image.alt = file.name;
                    container.appendChild(image);
                });
                reader.addEventListener('error', () => {
                    progress.textContent = 'Не удалось прочитать файл: ' + file.name;
                });
                reader.addEventListener('loadend', () => {
                    pendingReads -= 1;
                    remaining -= 1;
                    input.disabled = remaining > 0;
                    updateSendButton();
                });
                reader.readAsDataURL(file);
            }
            updateSendButton();
        }

        document.getElementById('add-card-form').addEventListener('submit', function (event) {
            event.preventDefault();
            if (generating) return;
            const nameInput = document.getElementById('class-name-input');
            const className = nameInput.value.trim();
            if (!className) return;
            const names = Array.from(document.querySelectorAll('.card h3')).map(item => item.textContent);
            if (names.includes(className)) {
                progress.textContent = 'Класс с таким названием уже добавлен.';
                return;
            }
            const card = document.createElement('div');
            card.className = 'card';
            const heading = document.createElement('h3');
            heading.textContent = className;
            const fileInput = document.createElement('input');
            fileInput.type = 'file';
            fileInput.accept = 'image/*';
            fileInput.multiple = true;
            fileInput.className = 'm-y';
            const container = document.createElement('div');
            fileInput.addEventListener('change', () => renderFiles(container, fileInput.files, fileInput));
            card.append(heading, fileInput, container);
            document.getElementById('card-list').appendChild(card);
            nameInput.value = '';
        });

        async function readResponse(response) {
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || 'Ошибка сервера: ' + response.status);
            return data;
        }

        async function waitForGeneration() {
            while (true) {
                const data = await readResponse(await fetch('/getp'));
                if (data.pech === -2 || data.error) throw new Error(data.error || 'Генерация прервана.');
                if (data.pech === -1) {
                    progress.textContent = 'Готово: ' + data.pechmax + ' изображений. Результаты в data/.';
                    return;
                }
                progress.textContent = data.pech + '/' + data.pechmax;
                await new Promise(resolve => setTimeout(resolve, 1000));
            }
        }

        sendButton.addEventListener('click', async function () {
            if (generating || pendingReads > 0) return;
            const cardsData = Array.from(document.querySelectorAll('.card')).map(card => ({
                name: card.querySelector('h3').textContent,
                files: Array.from(card.querySelectorAll('img')).map(image => image.src)
            }));
            const count = Number(document.getElementById('num-gen-input').value);
            if (!cardsData.length || cardsData.some(card => !card.files.length)) {
                progress.textContent = 'Добавьте классы и хотя бы одно изображение в каждый класс.';
                return;
            }
            if (!Number.isSafeInteger(count) || count <= 0) {
                progress.textContent = 'Укажите положительное целое количество изображений на класс.';
                return;
            }
            generating = true;
            updateSendButton();
            progress.textContent = 'Запуск генерации…';
            try {
                await readResponse(await fetch('/upload_cards', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({data: cardsData, togen: count})
                }));
                await waitForGeneration();
            } catch (error) {
                progress.textContent = error.message;
            } finally {
                generating = false;
                updateSendButton();
            }
        });
    </script>
</body>

</html>
